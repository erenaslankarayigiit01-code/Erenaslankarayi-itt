<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EREN ASLANKARAYİĞİT | Luxury Streetwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --bg-card: #121212;
            --bg-glass: rgba(18, 18, 18, 0.85);
            --border-color: #262626;
            --accent-silver: #e2e8f0;
            --accent-dim: #888888;
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --danger: #ef4444;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            transition: var(--transition);
        }

        .logo {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            color: var(--text-main);
            text-decoration: none;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-dim);
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: var(--transition);
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .cart-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .cart-btn:hover {
            transform: scale(1.1);
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--text-main);
            color: var(--bg-deep);
            font-size: 0.65rem;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* HERO SECTION */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            position: relative;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 70%);
        }

        .hero h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2rem, 5vw, 4.5rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
            background: linear-gradient(180deg, #ffffff 0%, #666666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 600px;
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .explore-btn {
            padding: 0.9rem 2.5rem;
            background: var(--text-main);
            color: var(--bg-deep);
            border: none;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 0px;
        }

        .explore-btn:hover {
            background: transparent;
            color: var(--text-main);
            box-shadow: inset 0 0 0 1px var(--text-main);
        }

        /* PRODUCTS SECTION */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 8rem 5% 5rem 5%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .section-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .filter-tabs {
            display: flex;
            gap: 1.5rem;
        }

        .filter-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: var(--transition);
            padding-bottom: 0.3rem;
            position: relative;
        }

        .filter-tab.active, .filter-tab:hover {
            color: var(--text-main);
        }

        .filter-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1.5rem;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--text-main);
        }

        /* GRID */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            border-color: #444;
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 400px;
            background: #181818;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
            filter: grayscale(20%);
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        .product-tag {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-name {
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .product-price {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .add-to-cart-quick {
            background: var(--text-main);
            color: var(--bg-deep);
            border: none;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-to-cart-quick:hover {
            background: var(--accent-dim);
            color: var(--text-main);
        }

        /* CART DRAWER */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -450px;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            z-index: 2000;
            transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .cart-item {
            display: flex;
            gap: 1.2rem;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 1rem;
            border: 1px solid var(--border-color);
        }

        .cart-item-img {
            width: 70px;
            height: 80px;
            object-fit: cover;
            background: #1a1a1a;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-name {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .cart-item-price {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .qty-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .remove-item {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: auto;
        }

        .cart-footer {
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-deep);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-family: 'Syncopate', sans-serif;
            font-size: 1rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--text-main);
            color: var(--bg-deep);
            border: none;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
        }

        .checkout-btn:hover {
            background: var(--accent-dim);
            color: var(--text-main);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 4rem 5%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .container { padding-top: 6rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Eren Aslankarayiğit <span>/ STWD</span></a>
        <ul class="nav-links">
            <li><a onclick="filterProducts('all')" class="active" id="tab-all">Tümü</a></li>
            <li><a onclick="filterProducts('erkek')" id="tab-erkek">Erkek</a></li>
            <li><a onclick="filterProducts('kadin')" id="tab-kadin">Kadın</a></li>
            <li><a onclick="filterProducts('unisex')" id="tab-unisex">Unisex</a></li>
        </ul>
        <div class="header-actions">
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <h1>DARK STREETWEAR</h1>
        <p>Lüks sokak modasının karanlık ve gotik çizgileriyle yeniden tanımlanan koleksiyon.</p>
        <button class="explore-btn" onclick="document.getElementById('shop').scrollIntoView({behavior: 'smooth'})">Koleksiyonu Keşfet</button>
    </section>

    <div class="container" id="shop">
        <div class="section-header">
            <h2 class="section-title">Koleksiyon '26</h2>
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterProducts('all')">Tümü</button>
                <button class="filter-tab" onclick="filterProducts('erkek')">Erkek</button>
                <button class="filter-tab" onclick="filterProducts('kadin')">Kadın</button>
                <button class="filter-tab" onclick="filterProducts('unisex')">Unisex</button>
            </div>
        </div>

        <div class="products-grid" id="product-grid">
            <!-- JavaScript ile doldurulacak -->
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3 class="cart-title">Alışveriş Sepeti</h3>
            <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Sepet boş -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Toplam</span>
                <span id="cart-total-price">0.00 TL</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Siparişi Tamamla</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Eren Aslankarayiğit. Tüm Hakları Saklıdır.</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Obsidian Oversize Sweatshirt", category: "erkek", price: 1850, image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=800&q=80" },
            { id: 2, name: "Cyberpunk Heavyweight T-Shirt", category: "unisex", price: 950, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80" },
            { id: 3, name: "Gothic Velvet Crop Hoodie", category: "kadin", price: 1650, image: "https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=800&q=80" },
            { id: 4, name: "Matrix Minimalist T-Shirt", category: "erkek", price: 890, image: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&w=800&q=80" },
            { id: 5, name: "Void Oversize Sweatshirt", category: "kadin", price: 1900, image: "https://images.unsplash.com/photo-1578587018452-892bacefd3f2?auto=format&fit=crop&w=800&q=80" },
            { id: 6, name: "Nocturnal Street Tee", category: "unisex", price: 920, image: "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=800&q=80" }
        ];

        let cart = [];

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            filtered.forEach(product => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-image">
                            <span class="product-tag">${product.category}</span>
                            <img src="${product.image}" alt="${product.name}">
                        </div>
                        <div class="product-info">
                            <div>
                                <h3 class="product-name">${product.name}</h3>
                            </div>
                            <div class="product-footer">
                                <span class="product-price">${product.price.toLocaleString()} TL</span>
                                <button class="add-to-cart-quick" onclick="addToCart(${product.id})">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            renderProducts(category);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCart();
            toggleCart();
        }

        function updateCart() {
            const countEl = document.getElementById('cart-count');
            const itemsEl = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total-price');
            
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            countEl.innerText = totalCount;
            
            if (cart.length === 0) {
                itemsEl.innerHTML = '<p style="color: var(--text-muted); text-align: center; font-size: 0.85rem;">Sepetiniz boş.</p>';
                totalEl.innerText = '0.00 TL';
                return;
            }
            
            itemsEl.innerHTML = '';
            let totalPrice = 0;
            
            cart.forEach(item => {
                totalPrice += item.price * item.quantity;
                itemsEl.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" class="cart-item-img" alt="${item.name}">
                        <div class="cart-item-details">
                            <h4 class="cart-item-name">${item.name}</h4>
                            <div class="cart-item-price">${item.price.toLocaleString()} TL</div>
                            <div class="cart-item-actions">
                                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                                <span style="font-size: 0.85rem;">${item.quantity}</span>
                                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        <button class="remove-item" onclick="removeItem(${item.id})"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            });
            
            totalEl.innerText = totalPrice.toLocaleString() + ' TL';
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeItem(productId);
                } else {
                    updateCart();
                }
            }
        }

        function removeItem(productId) {
            cart = cart.filter(i => i.id !== productId);
            updateCart();
        }

        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Sepetiniz boş!');
                return;
            }
            alert('Sipariş simülasyonu başarılı! Eren Aslankarayiğit koleksiyonu için teşekkürler.');
            cart = [];
            updateCart();
            toggleCart();
        }

        renderProducts();
    </script>
</body>
</html>
